{% extends "base.html" %}
{% block title %}{{ role_label }} home · {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="wrap page">
  <header class="role-head">
    <h1>{{ role_label }} home</h1>
    <p>Welcome, {{ g.current_account.name }}.</p>
  </header>
  <ul class="tools">
    {% for tool in tools %}
    <li class="tool">
      <h3><a href="{{ url_for(tool.endpoint) }}">{{ tool.name }}</a></h3>
      <p>{{ tool.description }}</p>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}

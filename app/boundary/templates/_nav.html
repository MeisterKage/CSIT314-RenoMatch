{% if g.current_account %}
  <span class="who">{{ g.current_account.full_name }}</span>
  <a href="{{ url_for(ROLE_HOME[g.current_account.role]) }}">Home</a>
  <a href="{{ url_for('auth.change_password') }}">Change password</a>
  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="link-button" type="submit">Log out</button>
  </form>
{% else %}
  <a href="{{ url_for('auth.login') }}">Log in</a>
  <a href="{{ url_for('auth.register') }}">Create account</a>
{% endif %}

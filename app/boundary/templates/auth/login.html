{% extends "base.html" %}
{% block title %}Log in · {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="wrap auth">
  <div class="auth__form">
    <h1>Log in</h1>
    <p>Welcome back. Pick up where you left off.</p>
    {% if error %}<div class="flash flash--danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button button--full" type="submit">Log in</button>
    </form>
    <p class="auth__switch"><a href="{{ url_for('reset_password.forgot') }}">Forgot password?</a></p>
    <p class="auth__switch">New to {{ config.SITE_NAME }}? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
  <div class="auth__photo">
    <img src="{{ url_for('static', filename='img/auth-kitchen.jpg') }}" alt="" width="1200" height="800">
  </div>
</div>
{% endblock %}

<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <rect width="96" height="96" fill="#1F5F5B"/>
  <!-- Quarter rosettes in each corner join into full rosettes where four tiles meet. -->
  <g fill="#F1F3EF">
    <circle cx="0" cy="0" r="26"/><circle cx="96" cy="0" r="26"/>
    <circle cx="0" cy="96" r="26"/><circle cx="96" cy="96" r="26"/>
  </g>
  <g fill="#C9707D">
    <circle cx="0" cy="0" r="16"/><circle cx="96" cy="0" r="16"/>
    <circle cx="0" cy="96" r="16"/><circle cx="96" cy="96" r="16"/>
  </g>
  <g fill="#1F5F5B">
    <circle cx="0" cy="0" r="6"/><circle cx="96" cy="0" r="6"/>
    <circle cx="0" cy="96" r="6"/><circle cx="96" cy="96" r="6"/>
  </g>
  <!-- Centre: a plaster diamond holding a four-petal flower. -->
  <path d="M48 16 L80 48 L48 80 L16 48 Z" fill="#F1F3EF"/>
  <path d="M48 23 L73 48 L48 73 L23 48 Z" fill="none" stroke="#1F5F5B" stroke-width="1.5"/>
  <g fill="#C9707D">
    <path id="petal" d="M48 28 C55 35 55 42 48 48 C41 42 41 35 48 28 Z"/>
    <use href="#petal" transform="rotate(90 48 48)"/>
    <use href="#petal" transform="rotate(180 48 48)"/>
    <use href="#petal" transform="rotate(270 48 48)"/>
  </g>
  <circle cx="48" cy="48" r="5" fill="#1F5F5B"/>
</svg>
